name: Free Artwork Provider Probe

on:
  push:
    branches: [feature/illustrated-cutout-renderer]
    paths:
      - ".github/workflows/free-artwork-provider-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-artwork-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow

      - name: Request one free anonymous artwork sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-output
          PROMPT="high quality editorial 2D illustrated animation background, cinematic rainy city street at night, detailed hand-painted digital illustration, layered depth, rich atmospheric lighting, no text, no watermark"
          ENCODED_PROMPT="$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["PROMPT"]))')"
          URL="https://image.pollinations.ai/prompt/${ENCODED_PROMPT}?width=768&height=768&seed=4182026&nologo=true"
          HTTP_CODE="$(curl --location --silent --show-error --max-time 150 --retry 1 --retry-delay 50 --user-agent "Mozilla/5.0 WISE-LAB-GitHubActions/1.0" --output probe-output/sample-image --write-out "%{http_code}" "$URL")"
          echo "Provider HTTP status: $HTTP_CODE"
          test "$HTTP_CODE" = "200" || { echo "Free anonymous image endpoint did not return HTTP 200."; head -c 1000 probe-output/sample-image || true; exit 1; }
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path("probe-output/sample-image")
          with Image.open(p) as im:
              im.verify()
          with Image.open(p) as im:
              print(f"IMAGE_OK format={im.format} size={im.size} mode={im.mode} bytes={p.stat().st_size}")
              p.rename(f"probe-output/artwork-sample.{im.format.lower()}")
          PY

      - name: Upload generated sample
        uses: actions/upload-artifact@v4
        with:
          name: free-artwork-provider-probe-${{ github.run_number }}
          path: probe-output/artwork-sample.*
          if-no-files-found: error
          retention-days: 7
