name: WISE-LAB Comic Book Parallel Test
on:
  push:
    branches: [experiment/comic-book-engine]
    paths:
      - 'prototype/comic_page_engine.py'
      - '.github/workflows/comic-book-test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wise-comic-book-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render-comic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering and narration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil ffmpeg espeak-ng
      - name: Generate six-scene narration
        run: |
          mkdir -p renders/comic
          espeak-ng -v en-us -s 132 -w renders/comic/narration.wav "You promise yourself just ten minutes of focused work. A notification flashes while the room stays quiet. Outside, every screen competes for your attention. You return to work, but your mind keeps checking. One glance becomes a chain of tiny distractions. You put the phone away and choose what matters."
      - name: Render illustrated comic pages and compose narration
        run: |
          python3 prototype/comic_page_engine.py
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of json renders/wise-lab-comic-20sec.mp4 > renders/wise-lab-comic-report.json
      - name: Upload comic-book MP4 only
        uses: actions/upload-artifact@v4
        with:
          name: wise-lab-comic-book-preview-${{ github.run_number }}
          path: renders/wise-lab-comic-20sec.mp4
          if-no-files-found: error
          retention-days: 7
