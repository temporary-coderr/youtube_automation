name: WISE-LAB Animation Integration Benchmark

on:
  push:
    branches:
      - integration/hybrid-animation-2026-11-14
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wise-lab-animation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip Pillow
      - name: Compile Python prototypes
        run: |
          python - <<'PY'
          from pathlib import Path
          files = list(Path('experiments/2026-11-14').glob('*.py')) + list(Path('renderer').glob('*.py'))
          for path in files:
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
              print('PASS', path)
          PY
      - name: Render 20-second animation sample
        run: python experiments/2026-11-14/production_character_benchmark.py
      - name: Verify MP4 streams and duration
        run: python renderer/verify_render.py renders/wise-lab-production-character-20sec.mp4
      - name: Save render metadata
        if: always()
        run: |
          mkdir -p renders
          ffprobe -v error -show_format -show_streams -of json renders/wise-lab-production-character-20sec.mp4 > renders/ffprobe-report.json || true
      - name: Upload animation benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wise-lab-animation-integration-${{ github.run_number }}
          path: |
            renders/wise-lab-production-character-20sec.mp4
            renders/ffprobe-report.json
          if-no-files-found: warn
          retention-days: 14
