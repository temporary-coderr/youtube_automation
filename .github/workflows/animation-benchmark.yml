name: WISE-LAB Integrated Rig Video

on:
  push:
    branches:
      - integration/hybrid-animation-2026-11-14
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wise-lab-integrated-rig-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-integrated-video:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Install Python renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Compile renderer
        run: python -m py_compile renderer/render_integrated.py renderer/verify_render.py
      - name: Render actual articulated Canvas rig to MP4
        run: python renderer/render_integrated.py
      - name: Verify integrated MP4
        run: python renderer/verify_render.py renders/integrated/wise-lab-integrated-rig-12sec.mp4
      - name: Save render metadata
        if: always()
        run: |
          mkdir -p renders/integrated
          ffprobe -v error -show_format -show_streams -of json renders/integrated/wise-lab-integrated-rig-12sec.mp4 > renders/integrated/ffprobe-report.json || true
      - name: Upload actual video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wise-lab-integrated-rig-video-${{ github.run_number }}
          path: |
            renders/integrated/wise-lab-integrated-rig-12sec.mp4
            renders/integrated/ffprobe-report.json
          if-no-files-found: error
          retention-days: 14
