name: WISE-LAB Reference Comic Style Test
on:
  push:
    branches: [experiment/comic-book-engine]
    paths:
      - 'prototype/reference_comic_engine.py'
      - '.github/workflows/reference-comic-test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wise-reference-comic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render-reference-comic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer, fonts and narration
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil ffmpeg espeak-ng fonts-dejavu-core
      - name: Render reference-style comic sequence
        run: |
          mkdir -p renders
          python3 prototype/reference_comic_engine.py
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of json renders/wise-lab-reference-style-18sec.mp4 | tee renders/reference-comic-report.json
      - name: Upload MP4 and render report
        uses: actions/upload-artifact@v4
        with:
          name: wise-lab-reference-comic-${{ github.run_number }}
          path: |
            renders/wise-lab-reference-style-18sec.mp4
            renders/reference-comic-report.json
          if-no-files-found: error
          retention-days: 7

# rerun after FFmpeg diagnostics fix
