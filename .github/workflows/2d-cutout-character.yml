name: WISE-LAB 2D Cutout Character Prototype
on:
  push:
    branches: [experiment/2d-character-engine]
    paths:
      - 'prototype/2d_cutout_character_prototype.py'
      - '.github/workflows/2d-cutout-character.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wise-lab-2d-cutout-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install vector renderer and video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-cairosvg python3-pil ffmpeg fonts-dejavu-core
      - name: Render 2D cutout character action test
        run: |
          mkdir -p renders
          python3 prototype/2d_cutout_character_prototype.py
          test -s renders/wise-lab-2d-cutout-phone-action.mp4
          test -s renders/wise-lab-2d-cutout-contact.jpg
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate,codec_name -of json renders/wise-lab-2d-cutout-phone-action.mp4
      - name: Upload MP4, contact sheet and report
        uses: actions/upload-artifact@v4
        with:
          name: wise-lab-2d-cutout-${{ github.run_number }}
          path: |
            renders/wise-lab-2d-cutout-phone-action.mp4
            renders/wise-lab-2d-cutout-contact.jpg
            renders/wise-lab-2d-cutout-report.json
          if-no-files-found: error
          retention-days: 7
