name: 2D Character Animation Rig Benchmark
on:
  workflow_dispatch:
  push:
    branches: [feature/cinematic-engine]
    paths:
      - 'prototype/2d_rig_benchmark.py'
      - '.github/workflows/2d-rig-benchmark.yml'
permissions:
  contents: read
concurrency:
  group: 2d-rig-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install frame renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil
      - name: Render 12-second articulated 2D animation
        run: |
          mkdir -p renders
          python3 prototype/2d_rig_benchmark.py
      - name: Create contact sheet
        run: ffmpeg -y -i renders/2d-rig-benchmark.mp4 -vf "fps=1,scale=320:-1,tile=4x3" -frames:v 1 renders/2d-rig-contact-sheet.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: wise-lab-2d-rig-${{ github.run_number }}
          path: |
            renders/2d-rig-benchmark.mp4
            renders/2d-rig-contact-sheet.jpg
          if-no-files-found: error
          retention-days: 7
