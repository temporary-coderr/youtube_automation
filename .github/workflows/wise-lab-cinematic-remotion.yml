name: WISE-LAB Cinematic Preview
on:
  push:
    branches: [wise-lab-cinematic-v1, feat/wise-lab-small-cast-story-engine]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/wise-lab-cinematic-remotion.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Install Edge TTS
        run: python -m pip install --no-cache-dir edge-tts
      - name: Generate narration and word-timed SRT
        run: |
          mkdir -p public out
          python scripts/generate_narration.py
          test -s public/narration.mp3
          test -s public/captions.srt
      - name: Create original ambient bed
        run: python scripts/make_ambience.py
      - name: Render illustrated story film
        run: npx remotion render src/index.jsx WiseLab out/wise-lab-illustrated-story.mp4 --codec h264 --crf 19 --log=error --concurrency=2
      - name: Validate MP4 and subtitle sidecar
        run: |
          test -s out/wise-lab-illustrated-story.mp4
          test -s public/captions.srt
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json out/wise-lab-illustrated-story.mp4
          ffmpeg -v error -i out/wise-lab-illustrated-story.mp4 -f null -
      - name: Upload video and subtitles
        uses: actions/upload-artifact@v4
        with:
          name: wise-lab-illustrated-story-v2
          path: |
            out/wise-lab-illustrated-story.mp4
            public/captions.srt
          if-no-files-found: error
          retention-days: 14
