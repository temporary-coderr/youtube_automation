name: WISE-LAB Premium Animation Showcase
on:
  push:
    branches: [wise-lab-cinematic-v1]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/wise-lab-cinematic-remotion.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Render premium 12-second animation showcase
        run: npx remotion render src/index.jsx WiseLabShowcase out/wise-lab-premium-showcase.mp4 --codec h264 --crf 17 --log=error --concurrency=2
      - name: Validate rendered video
        run: |
          test -s out/wise-lab-premium-showcase.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json out/wise-lab-premium-showcase.mp4
          ffmpeg -v error -i out/wise-lab-premium-showcase.mp4 -f null -
      - name: Upload showcase
        uses: actions/upload-artifact@v4
        with:
          name: wise-lab-premium-showcase-v1
          path: out/wise-lab-premium-showcase.mp4
          if-no-files-found: error
          retention-days: 14
