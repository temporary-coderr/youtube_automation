name: WISE-LAB Prototype Benchmark Suite

on:
  push:
    branches:
      - integration/hybrid-animation-2026-11-14
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wise-lab-prototype-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pillow-renderers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install Pillow
      - name: Compile candidate renderers
        run: |
          python -m py_compile experiments/2026-11-14/comic_book_benchmark.py
          python -m py_compile experiments/2026-11-14/reference_comic_engine.py
          python -m py_compile experiments/2026-11-14/framebyframe_benchmark.py
      - name: Render comic-book benchmark with matched narration
        run: |
          mkdir -p renders/comic
          espeak-ng -v en-us -s 145 -w renders/comic/narration.wav "You sit down to focus and finally find your rhythm. Then your phone lights up with one tiny notification. Your hand reaches for it before you even decide. A moment later your attention has drifted away."
          python experiments/2026-11-14/comic_book_benchmark.py
      - name: Render four-environment reference comic
        run: python experiments/2026-11-14/reference_comic_engine.py
      - name: Render frame-by-frame motion study and add narration
        run: |
          python experiments/2026-11-14/framebyframe_benchmark.py
          espeak-ng -v en-us -s 145 -w renders/framebyframe-narration.wav "A person approaches the desk. The phone lights up. Their arm reaches forward and lifts the phone. The interruption changes the next few minutes."
          ffmpeg -hide_banner -loglevel error -y -i renders/framebyframe-benchmark.mp4 -i renders/framebyframe-narration.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 160k -shortest renders/framebyframe-benchmark-narrated.mp4
      - name: Validate rendered videos
        run: |
          for f in renders/wise-lab-comic-20sec.mp4 renders/wise-lab-reference-style-18sec.mp4 renders/framebyframe-benchmark-narrated.mp4 renders/wise-lab-cinematic-2d.mp4; do
            test -s "$f"
            ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of compact=p=0 "$f"
          done
      - name: Upload 2D benchmark videos
        uses: actions/upload-artifact@v4
        with:
          name: wise-lab-2d-prototype-benchmarks-${{ github.run_number }}
          path: |
            renders/wise-lab-comic-20sec.mp4
            renders/wise-lab-reference-style-18sec.mp4
            renders/framebyframe-benchmark-narrated.mp4
          if-no-files-found: error
          retention-days: 14

  blender-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg
      - name: Run 3D articulated character benchmark
        env:
          WISE_OUTPUT: renders/blender-benchmark.mp4
        run: |
          mkdir -p renders
          blender --background --factory-startup --python experiments/2026-11-14/blender_benchmark.py
      - name: Validate Blender render
        run: |
          test -s renders/blender-benchmark.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of compact=p=0 renders/blender-benchmark.mp4
      - name: Upload Blender animation pass
        uses: actions/upload-artifact@v4
        with:
          name: wise-lab-blender-rig-benchmark-${{ github.run_number }}
          path: |
            renders/blender-benchmark.mp4
            renders/blender-benchmark.blend
          if-no-files-found: warn
          retention-days: 14
